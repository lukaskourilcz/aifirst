<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav style="display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center;padding:12px 0;border-bottom:1px solid #cfcbc2;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em">
  <a href="R2 Index.dc.html" style="text-decoration:none;color:#1c1b19;font-weight:700;margin-right:14px">DNESKAi · review r2</a>
  <sc-for list="{{ items }}" as="it" hint-placeholder-count="8">
    <a href="{{ it.href }}" style="text-decoration:none;padding:5px 8px;color:{{ it.color }};background:{{ it.bg }}">{{ it.label }}</a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:50},&quot;current&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const cur = this.props.current ?? "";
    const list = [["01","Review","01 Review.dc.html"],["02","Front page","02 Front Page.dc.html"],["03","Navigation","03 Navigation.dc.html"],["04","Section page","04 Section Page.dc.html"],["05","Article","05 Article.dc.html"],["06","Week + Archive","06 Week Archive.dc.html"],["07","Design system","07 Design System.dc.html"]];
    return { items: list.map(([n, l, href]) => ({ href, label: `${n} ${l}`, color: n === cur ? "#fff" : "#3c4149", bg: n === cur ? "#1c1b19" : "transparent" })) };
  }
}
</script>
</body>
</html>
