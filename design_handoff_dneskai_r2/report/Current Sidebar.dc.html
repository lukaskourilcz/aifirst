<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<aside style="width:244px;flex:none;border-right:1px solid #e2e2de;padding:30px 26px 30px 0;display:flex;flex-direction:column;gap:30px;font-family:'Space Grotesk',sans-serif;font-size:13px;min-height:900px">
  <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start">
    <img src="public/brand/DNESKAi-logo.svg" alt="DNESKAi" style="display:block;height:20px;width:auto">
    <p style="margin:0;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#5f6672;line-height:1.5">To podstatné z AI.<br>Každý den.</p>
  </div>
  <nav style="display:flex;flex-direction:column;gap:2px">
    <sc-for list="{{ primary }}" as="it" hint-placeholder-count="4">
      <a href="#" style="display:flex;align-items:center;min-height:44px;padding:0 12px 0 0;font-size:15px;font-weight:500;color:{{ it.color }};background:{{ it.bg }};border-left:2px solid {{ it.border }};text-decoration:none">
        <span style="width:1.75rem;flex:none;padding-left:4px;color:{{ it.indexColor }};font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em">{{ it.index }}</span>
        <span>{{ it.label }}</span>
      </a>
    </sc-for>
    <div style="border-top:1px solid #e2e2de;margin:12px 0"></div>
    <sc-for list="{{ secondary }}" as="it" hint-placeholder-count="4">
      <a href="#" style="display:flex;align-items:center;min-height:36px;padding-left:1.75rem;font-size:13px;font-weight:500;color:{{ it.color }};background:{{ it.bg }};border-left:2px solid {{ it.border }};text-decoration:none">{{ it.label }}</a>
    </sc-for>
    <div style="border-top:1px solid #e2e2de;margin:12px 0"></div>
    <button style="display:flex;align-items:center;gap:4px;min-height:44px;padding:0;border:0;background:transparent;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:500;color:#3c4149;cursor:pointer;text-align:left">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"></circle><line x1="10.5" y1="10.5" x2="14" y2="14"></line></svg>
      <span>hledat</span>
    </button>
  </nav>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:244,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;today&quot;,&quot;week&quot;,&quot;topics&quot;,&quot;archive&quot;,&quot;glossary&quot;,&quot;sources&quot;,&quot;corrections&quot;,&quot;about&quot;],&quot;default&quot;:&quot;today&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? "today";
    const mk = (key, label, i) => {
      const on = key === active;
      return { key, label, index: i, color: on ? "#2f5ae6" : (i ? "#3c4149" : "#5f6672"), bg: on ? "#ffffff" : "transparent", border: on ? "#2f5ae6" : "transparent", indexColor: on ? "#2f5ae6" : "#5f6672" };
    };
    return {
      primary: [mk("today", "Dnes", "01"), mk("week", "Poslední týden", "02"), mk("topics", "Témata", "03"), mk("archive", "Archiv", "04")],
      secondary: [mk("glossary", "Slovník"), mk("sources", "Zdroje"), mk("corrections", "Opravy"), mk("about", "O magazínu")],
    };
  }
}
</script>
</body>
</html>
