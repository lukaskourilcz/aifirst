name: weekly

on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch:
    inputs:
      date: { description: "Sunday date (YYYY-MM-DD; blank = latest Sunday UTC)", required: false, type: string }
      language:
        description: "Language output"
        required: true
        default: all
        type: choice
        options: [all, en, cs]
      publish_mode:
        description: "Publishing mode"
        required: true
        default: auto
        type: choice
        options: [auto, pull_request, dry_run]
      image_provider:
        description: "Illustration provider"
        required: true
        default: none
        type: choice
        options: [none, fal, nasa, picsum]
      model_profile: { description: "Committed model profile", required: true, default: standard, type: string }
      force: { description: "Overwrite existing weekly edition", required: true, default: false, type: boolean }
      skip_embeddings: { description: "Reserved compatibility input", required: true, default: true, type: boolean }

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-${{ github.event_name == 'schedule' && 'scheduled' || inputs.date }}-${{ inputs.language || 'all' }}
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Resolve inputs
        env:
          REQUESTED_DATE: ${{ inputs.date }}
          REQUESTED_LANGUAGE: ${{ inputs.language }}
          REQUESTED_MODE: ${{ inputs.publish_mode }}
          REQUESTED_IMAGE: ${{ inputs.image_provider }}
          SCHEDULED_IMAGE: ${{ vars.IMAGE_PROVIDER }}
          REQUESTED_PROFILE: ${{ inputs.model_profile }}
          REQUESTED_FORCE: ${{ inputs.force }}
        run: |
          if [ -n "$REQUESTED_DATE" ]; then issue_date="$REQUESTED_DATE"; else issue_date=$(date -u -d "-$(date -u +%w) days" +%F); fi
          echo "ISSUE_DATE=$issue_date" >> "$GITHUB_ENV"
          echo "ISSUE_LANGUAGE=${REQUESTED_LANGUAGE:-all}" >> "$GITHUB_ENV"
          echo "PUBLISH_MODE=${REQUESTED_MODE:-auto}" >> "$GITHUB_ENV"
          echo "IMAGE_PROVIDER=${REQUESTED_IMAGE:-${SCHEDULED_IMAGE:-none}}" >> "$GITHUB_ENV"
          echo "MODEL_PROFILE=${REQUESTED_PROFILE:-standard}" >> "$GITHUB_ENV"
          echo "FORCE_GENERATION=${REQUESTED_FORCE:-false}" >> "$GITHUB_ENV"
      - name: Generate weekly edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          OWNDASHBOARD_RUN_REPORT_URL: ${{ secrets.OWNDASHBOARD_RUN_REPORT_URL }}
          OWNDASHBOARD_RUN_REPORT_TOKEN: ${{ secrets.OWNDASHBOARD_RUN_REPORT_TOKEN }}
        run: pnpm generate:weekly
      - name: Verify generated publication
        run: |
          mkdir -p generated
          set -o pipefail
          pnpm verify 2>&1 | tee generated/validation.log
      - name: Upload weekly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ env.ISSUE_DATE }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            generated/run-reports/*.json
            generated/validation.log
            generated/newsletters/**
            public/data/share/${{ env.ISSUE_DATE }}.weekly.*.json
            content/articles/${{ env.ISSUE_DATE }}-weekly*.mdx
            public/illustrations/${{ env.ISSUE_DATE }}-weekly*.webp
      - name: Commit and push automatically
        if: env.PUBLISH_MODE == 'auto'
        run: |
          git config user.name "aifirst-bot"
          git config user.email "bot@aifirst"
          git add content/articles public/illustrations public/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "weekly: $ISSUE_DATE"
          git push
      - name: Open review pull request
        if: env.PUBLISH_MODE == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "aifirst-bot"
          git config user.email "bot@aifirst"
          branch="generated/weekly-${ISSUE_DATE}-${ISSUE_LANGUAGE}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add content/articles public/illustrations public/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "weekly(review): $ISSUE_DATE"
          git push --set-upstream origin "$branch"
          report=$(find generated/run-reports -name '*.json' -print -quit)
          cost=$(jq -r '.totalCost.amount // "unavailable"' "$report")
          signal=$(jq -r '.editorial.signalStrength // "unavailable"' "$report")
          sources=$(jq -r '.editorial.citedSources' "$report")
          gh pr create --title "Weekly edition: $ISSUE_DATE" --body "Generated Caught Up weekly edition. Language: $ISSUE_LANGUAGE. Cost: $cost USD. Signal: $signal. Cited sources: $sources. Newsletter, preview data, and the private run report are attached to the workflow. Validation: pnpm verify passed."
