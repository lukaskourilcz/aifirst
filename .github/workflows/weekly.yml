name: weekly

on:
  schedule:
    - cron: "0 7 * * 0"  # Sunday 07:00 UTC, one hour after the daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate weekly digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: pnpm tsx scripts/generate-weekly.ts

      - name: Commit
        run: |
          git config user.name "aifirst-bot"
          git config user.email "bot@aifirst"
          git add content/articles public/illustrations
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "weekly: $(date -u +%F)"
            git push
          fi
