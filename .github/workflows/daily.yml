name: daily

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate today's article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          # Auto-provided by Actions; raises the github-ai-releases source's
          # rate limit and is ignored by the other adapters.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional news-source keys — each source self-skips when unset.
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          NYTIMES_API_KEY: ${{ secrets.NYTIMES_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}
          # Optional reader fallback for the generic HTML adapter. Jina is
          # keyless; Firecrawl uses this key when present. Both no-op otherwise.
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: pnpm generate:daily

      - name: Refresh AI pulse (model pricing, service status, npm momentum)
        # Keyless; resilient — failures leave the previous pulse.json in place.
        run: pnpm pulse:refresh

      - name: Embed new articles for semantic related issues
        # No-op when JINA_API_KEY is unset; related issues fall back to tags.
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: pnpm embed:refresh

      - name: Commit
        run: |
          git config user.name "aifirst-bot"
          git config user.email "bot@aifirst"
          git add content/articles public/illustrations public/data
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "daily: $(date -u +%F)"
            git push
          fi

      # Uptime heartbeat (Better Stack / UptimeRobot). Runs only if every step
      # above succeeded, so a failed daily run sends NO ping and the monitor
      # alerts you. No-op until you add the HEARTBEAT_URL secret — see NEEDED.md.
      - name: Ping uptime heartbeat
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          if [ -n "$HEARTBEAT_URL" ]; then
            curl -fsS --max-time 10 "$HEARTBEAT_URL" && echo "heartbeat sent"
          else
            echo "HEARTBEAT_URL not set; skipping heartbeat"
          fi
