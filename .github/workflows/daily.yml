name: daily sentinel

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Prague publication date (YYYY-MM-DD; blank = today)"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-sentinel-${{ inputs.date || 'scheduled' }}
  cancel-in-progress: false

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the Prague publication day
        id: publication
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          issue_date="${REQUESTED_DATE:-$(TZ=Europe/Prague date +%F)}"
          if ! [[ "$issue_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || test "$(date -u -d "$issue_date" +%F 2>/dev/null)" != "$issue_date"; then
            echo "date must be a real YYYY-MM-DD value"
            exit 1
          fi
          english="content/articles/${issue_date}.en.mdx"
          czech="content/articles/${issue_date}.cs.mdx"
          board="public/data/board/${issue_date}.json"
          echo "issue_date=$issue_date" >> "$GITHUB_OUTPUT"
          # Czech is the published locale. The English file is a legacy artifact that no
          # delivery has written since the translate stage was retired, so requiring it turned
          # every good Czech-only day into a "missed day" issue -- a false alarm on every single
          # day the magazine worked. It is still checked when it happens to exist, because a
          # historical bilingual day whose two files disagree is a real defect.
          if test -f "$czech" && test -f "$board"; then
            board_hash="$(jq -er --arg date "$issue_date" '
              select(
                .schemaVersion == "board-context/1" and
                .status == "edition" and
                .date == $date and
                (.whyThisStory | type) == "string" and
                (.whyThisStory | length) > 0
              ) |
              .packageHash |
              select(type == "string" and test("^[a-f0-9]{64}$"))
            ' "$board" 2>/dev/null || true)"
            czech_hash="$(sed -nE 's/^[[:space:]]*package_hash:[[:space:]]*"?([a-f0-9]{64})"?[[:space:]]*$/\1/p' "$czech" | head -1)"
            english_matches=true
            if test -f "$english"; then
              english_hash="$(sed -nE 's/^[[:space:]]*package_hash:[[:space:]]*"?([a-f0-9]{64})"?[[:space:]]*$/\1/p' "$english" | head -1)"
              test "$english_hash" = "$board_hash" || english_matches=false
            fi
            if test -n "$board_hash" && test "$czech_hash" = "$board_hash" && test "$english_matches" = "true"; then
              echo "found complete BoardlessAI edition: $czech, $board"
              exit 0
            fi
          fi
          if ! test -e "$czech" && test -f "$board" && jq -e --arg date "$issue_date" '
            .schemaVersion == "board-context/1" and
            .status == "no_edition" and
            .date == $date and
            (.packageHash | type) == "string" and
            (.packageHash | test("^[a-f0-9]{64}$")) and
            (.noEditionReason | type) == "string" and
            (.noEditionReason | length) > 0
          ' "$board" >/dev/null; then
            echo "found honest no-edition record: $board"
            exit 0
          fi
          echo "missing=true" >> "$GITHUB_OUTPUT"
          echo "no complete edition or honest no-edition record for $issue_date"

      - name: Open one missed-day issue
        if: steps.publication.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_DATE: ${{ steps.publication.outputs.issue_date }}
        run: |
          title="missed-day: ${ISSUE_DATE}"
          if gh issue list --state open --limit 100 --json title | jq -e --arg title "$title" 'any(.[]; .title == $title)' >/dev/null; then
            echo "open issue already exists: $title"
          else
            gh issue create --title "$title" --body "The 07:00 UTC sentinel found neither a complete EN/CS edition with matching BoardlessAI board/package hashes nor a valid public/data/board/${ISSUE_DATE}.json NO_EDITION record."
          fi
          exit 1
