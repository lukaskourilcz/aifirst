name: ci

on:
  # A delivery commit was already built and gated by quorum's delivery step minutes before it
  # landed here; rebuilding it pays for the same verification twice. These three paths are what
  # a delivery writes and nothing else does. Pull requests stay unfiltered.
  push:
    branches: [main, "claude/**"]
    paths-ignore:
      - "content/**"
      - "public/data/**"
      - "public/images/editions/**"
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate committed content
        run: pnpm check:content

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://aifirst.example
        run: pnpm build
