<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="font-family:'Space Grotesk',sans-serif;color:#14161a;background:#f7f7f5">
  <sc-if value="{{ full }}" hint-placeholder-val="{{ true }}">
    <div style="max-width:1360px;margin:0 auto;padding:0 40px">
      <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:92px">
        <p style="margin:0;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#3c4149">{{ dateLine }}</p>
        <a href="#" aria-label="DNESKAi – domů" style="display:inline-flex"><img src="public/brand/DNESKAi-logo.svg" alt="DNESKAi" style="display:block;height:34px;width:auto"></a>
        <div style="justify-self:end;display:flex;align-items:center;gap:8px">
          <a href="#" style="display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid #8e8e88;color:#14161a;font-size:14px;font-weight:500;text-decoration:none"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"></circle><line x1="10.5" y1="10.5" x2="14" y2="14"></line></svg>Hledat<span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5f6672;margin-left:4px">⌘K</span></a>
        </div>
      </div>
      <div style="border-top:2px solid #14161a"></div>
      <nav aria-label="Rubriky" style="display:flex;justify-content:center;gap:4px;height:50px;border-bottom:1px solid #c9c9c3">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="8">
          <a href="#" style="display:inline-flex;align-items:center;height:50px;padding:0 14px;font-size:15px;font-weight:{{ it.weight }};color:{{ it.color }};border-bottom:2px solid {{ it.line }};margin-bottom:-1px;text-decoration:none;white-space:nowrap">{{ it.label }}</a>
        </sc-for>
        <span style="width:1px;height:22px;margin:14px 8px;background:#c9c9c3"></span>
        <a href="#" style="display:inline-flex;align-items:center;gap:6px;height:50px;padding:0 14px;font-size:15px;font-weight:500;color:#3c4149;text-decoration:none;white-space:nowrap">Více<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 3l4 4 4-4"></path></svg></a>
      </nav>
    </div>
  </sc-if>

  <sc-if value="{{ sticky }}" hint-placeholder-val="{{ false }}">
    <div style="border-bottom:1px solid #c9c9c3;background:#f7f7f5;box-shadow:0 1px 0 #f7f7f5">
      <div style="max-width:1360px;margin:0 auto;padding:0 40px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:52px">
        <a href="#" style="display:inline-flex"><img src="public/brand/DNESKAi-logo.svg" alt="DNESKAi" style="display:block;height:20px;width:auto"></a>
        <nav aria-label="Rubriky" style="display:flex;gap:2px">
          <sc-for list="{{ items }}" as="it" hint-placeholder-count="8">
            <a href="#" style="display:inline-flex;align-items:center;height:52px;padding:0 12px;font-size:14px;font-weight:{{ it.weight }};color:{{ it.color }};border-bottom:2px solid {{ it.line }};margin-bottom:-1px;text-decoration:none;white-space:nowrap">{{ it.label }}</a>
          </sc-for>
          <a href="#" style="display:inline-flex;align-items:center;gap:6px;height:52px;padding:0 12px;font-size:14px;font-weight:500;color:#3c4149;text-decoration:none">Více<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 3l4 4 4-4"></path></svg></a>
        </nav>
        <div style="justify-self:end;display:flex;align-items:center;gap:14px"><span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#5f6672">{{ shortDate }}</span><a href="#" aria-label="Hledat" style="display:grid;place-items:center;width:40px;height:40px;color:#14161a"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"></circle><line x1="10.5" y1="10.5" x2="14" y2="14"></line></svg></a></div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
    <div style="display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;height:56px;padding:0 12px;background:#f7f7f5">
      <button aria-label="Menu" style="display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;background:transparent;color:#14161a"><span style="display:block;width:18px;height:2px;background:currentColor;box-shadow:0 -5px 0 currentColor,0 5px 0 currentColor"></span></button>
      <a href="#" style="justify-self:center;display:inline-flex;align-items:center;min-height:44px"><img src="public/brand/DNESKAi-logo.svg" alt="DNESKAi" style="display:block;height:20px;width:auto"></a>
      <a href="#" aria-label="Hledat" style="justify-self:end;display:grid;place-items:center;width:44px;height:44px;color:#14161a"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"></circle><line x1="10.5" y1="10.5" x2="14" y2="14"></line></svg></a>
    </div>
    <div style="margin:0 12px;border-top:2px solid #14161a"></div>
    <nav aria-label="Rubriky" style="display:flex;gap:0;overflow-x:auto;padding:0 12px;border-bottom:1px solid #c9c9c3;scrollbar-width:none">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="8">
        <a href="#" style="display:inline-flex;align-items:center;height:44px;padding:0 12px;font-size:15px;font-weight:{{ it.weight }};color:{{ it.color }};border-bottom:2px solid {{ it.line }};margin-bottom:-1px;text-decoration:none;white-space:nowrap;flex:none">{{ it.label }}</a>
      </sc-for>
      <a href="#" style="display:inline-flex;align-items:center;height:44px;padding:0 12px;font-size:15px;font-weight:500;color:#3c4149;text-decoration:none;white-space:nowrap;flex:none">Více</a>
    </nav>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:150},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;full&quot;,&quot;sticky&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;full&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;today&quot;,&quot;models&quot;,&quot;business&quot;,&quot;security&quot;,&quot;regulation&quot;,&quot;dev&quot;],&quot;default&quot;:&quot;today&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dateLine&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;pátek 25. 9. 2026&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const variant = this.props.variant ?? "full";
    const active = this.props.active ?? "today";
    const labels = [["today", "Dnes"], ["models", "Modely"], ["business", "Firmy a trh"], ["security", "Bezpečnost"], ["regulation", "Regulace"], ["dev", "Vývoj"]];
    const items = labels.map(([key, label]) => ({ key, label, weight: key === active ? 600 : 500, color: key === active ? "#14161a" : "#3c4149", line: key === active ? "#14161a" : "transparent" }));
    const dateLine = this.props.dateLine ?? "pátek 25. 9. 2026";
    return { full: variant === "full", sticky: variant === "sticky", mobile: variant === "mobile", items, dateLine, shortDate: dateLine.replace(/^\S+\s/, "") };
  }
}
</script>
</body>
</html>
