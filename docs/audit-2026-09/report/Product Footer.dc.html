<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer style="display:grid;grid-template-columns:minmax(220px,1.4fr) repeat(2,minmax(120px,.5fr)) minmax(200px,.6fr);gap:32px;align-items:start;padding:48px 0 64px;margin-top:64px;border-top:1px solid #c9c9c3;font-family:'Space Grotesk',sans-serif">
  <div style="min-width:0">
    <img src="public/brand/DNESKAi-logo.svg" alt="DNESKAi" style="display:block;height:18px;width:auto;margin-bottom:12px">
    <p style="margin:0;max-width:40ch;color:#3c4149;font-family:'Source Serif 4',Georgia,serif;font-size:15px;line-height:1.6">Výběrová denní publikace, která vysvětluje podstatné změny v AI a otevřeně ukazuje zdroje i nejistotu.</p>
  </div>
  <nav style="display:flex;flex-direction:column;align-items:flex-start;gap:7px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase">
    <p style="margin:0 0 8px;color:#14161a;letter-spacing:.14em">číst</p>
    <a href="#" style="color:#5f6672;text-decoration:none">radar</a><a href="#" style="color:#5f6672;text-decoration:none">témata</a><a href="#" style="color:#5f6672;text-decoration:none">týden</a><a href="#" style="color:#5f6672;text-decoration:none">archiv</a>
  </nav>
  <nav style="display:flex;flex-direction:column;align-items:flex-start;gap:7px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase">
    <p style="margin:0 0 8px;color:#14161a;letter-spacing:.14em">důvěra</p>
    <a href="#" style="color:#5f6672;text-decoration:none">o projektu</a><a href="#" style="color:#5f6672;text-decoration:none">opravy</a><a href="#" style="color:#5f6672;text-decoration:none">slovník</a><a href="#" style="color:#5f6672;text-decoration:none">zdroje</a><a href="#" style="color:#5f6672;text-decoration:none">atom kanál ↗</a>
  </nav>
  <div style="display:flex;flex-direction:column;align-items:flex-start;gap:7px">
    <p style="margin:0 0 8px;color:#14161a;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase">sledujte nás</p>
    <div style="display:flex;gap:8px">
      <span style="display:grid;place-items:center;width:44px;height:44px;color:#5f6672"><span style="width:20px;height:20px;border-radius:50%;background:#5f6672;opacity:.55"></span></span>
      <span style="display:grid;place-items:center;width:44px;height:44px;color:#5f6672"><span style="width:20px;height:20px;border:2px solid #5f6672;border-radius:5px;opacity:.55"></span></span>
      <span style="display:grid;place-items:center;width:44px;height:44px;color:#5f6672"><span style="width:20px;height:20px;border-radius:50%;border:2px solid #5f6672;opacity:.55"></span></span>
      <span style="display:grid;place-items:center;width:44px;height:44px;color:#5f6672;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;opacity:.6">X</span>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:260}}"></script>
</body>
</html>
