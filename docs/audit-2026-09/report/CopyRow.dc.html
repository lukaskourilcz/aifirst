<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:grid;grid-template-columns:120px minmax(0,1.1fr) 92px minmax(0,1fr);gap:14px;padding:10px 0;border-top:1px solid #d9d5cc;align-items:start;font-size:13.5px;line-height:1.5;color:#1c1b19">
  <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.04em;color:#5a5751;padding-top:2px;overflow-wrap:anywhere">{{ where }}</span>
  <span style="font-family:'Source Serif 4',Georgia,serif;font-size:14.5px;color:#14161a">„{{ current }}“</span>
  <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8a5a0d;padding-top:3px">{{ problem }}</span>
  <span style="font-family:'Source Serif 4',Georgia,serif;font-size:14.5px;color:{{ repColor }};font-style:{{ repStyle }}">{{ replacement }}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:60},&quot;where&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;/about&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Current text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;problem&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;cliché&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;replacement&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nový text&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const r = this.props.replacement ?? "";
    const del = r === "delete";
    return { where: this.props.where ?? "", current: this.props.current ?? "", problem: this.props.problem ?? "", replacement: del ? "delete" : r, repColor: del ? "#c0272c" : "#14161a", repStyle: del ? "italic" : "normal" };
  }
}
</script>
</body>
</html>
