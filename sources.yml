# Tech & AI source registry consumed by lib/scraping/run.ts.
# Add via `/add-source <url-or-name>` so URLs get verified before they land here.
# See .claude/skills/tech-source-scraper/SKILL.md for the schema.
#
# Weight tiers:
#   0.85 — primary lab / first-party sources
#   0.75 — top-tier independent analysis
#   0.60 — general tech press
#   0.50 — community feeds (HN, etc.)
# Sorted by id.

sources:
  - id: anthropic-news
    type: rss
    name: Anthropic
    url: https://www.anthropic.com/news/rss.xml
    weight: 0.85
    tags: [ai, primary-source]

  - id: ars-technica
    type: rss
    name: Ars Technica
    url: https://feeds.arstechnica.com/arstechnica/index
    weight: 0.6
    tags: [tech, news]

  - id: arxiv-cs-ai
    type: arxiv
    name: arXiv cs.AI
    query: cat:cs.AI
    weight: 0.6
    tags: [ai, research]

  - id: arxiv-cs-lg
    type: arxiv
    name: arXiv cs.LG
    query: cat:cs.LG
    weight: 0.6
    tags: [ml, research]

  - id: bluesky-language-models
    type: bluesky
    # Bluesky's searchPosts treats multiple terms as AND, not OR — keep
    # queries to a single keyword or short phrase. Add more bluesky sources
    # for other angles (e.g. "AI research", "AI safety") rather than trying
    # to OR them in one query.
    name: Bluesky · language models
    query: language model
    weight: 0.55
    tags: [social, ai]

  - id: deepmind-blog
