    tags: [tech, analysis]

  - id: nieman-lab
    type: html
    # No public RSS/Atom that survives its Cloudflare edge, so this uses the
    # generic HTML adapter: cheerio reads <article> links, and when the markup
    # is JS-rendered/gated it falls back to a reader service (keyless Jina, or
    # Firecrawl with FIRECRAWL_API_KEY) for clean main-content links.
    name: Nieman Lab
    url: https://www.niemanlab.org/
    weight: 0.7
    tags: [platforms, media, journalism, ai, analysis]

  - id: nytimes-tech
    type: nytimes
    # Requires NYTIMES_API_KEY (free dev key: 500 req/day, 5 req/min).
    # Skipped automatically when the key is unset.
    name: New York Times · AI
    query: artificial intelligence
    weight: 0.6
    tags: [tech, news]

  - id: openai-blog
