# Read-only citation registry. BoardlessAI owns source collection and delivery.
# Add via `/add-source <url-or-name>` so URLs get verified before they land here.
# See .claude/skills/tech-source-scraper/SKILL.md for the schema.
#
# Weight tiers:
#   0.85 — primary lab / first-party sources
#   0.75 — top-tier independent analysis
#   0.60 — general tech press
#   0.50 — community feeds (HN, etc.)
# Sorted by id.

sources:
  - id: 404-media
    type: rss
    name: 404 Media
    url: https://www.404media.co/rss/
    weight: 0.75
    tags: [platforms, ai, content, investigative]

  - id: anthropic-news
    type: rss
    name: Anthropic
    url: https://www.anthropic.com/news/rss.xml
    weight: 0.85
    tags: [ai, primary-source]

  - id: ars-technica
    type: rss
    name: Ars Technica
    url: https://feeds.arstechnica.com/arstechnica/index
    weight: 0.6
    tags: [tech, news]

  - id: arxiv-cs-ai
    type: arxiv
    name: arXiv cs.AI
    query: cat:cs.AI
    weight: 0.6
    tags: [ai, research]

  - id: arxiv-cs-lg
    type: arxiv
    name: arXiv cs.LG
    query: cat:cs.LG
    weight: 0.6
    tags: [ml, research]

  - id: bluesky-language-models
    type: bluesky
    # Bluesky's searchPosts treats multiple terms as AND, not OR — keep
    # queries to a single keyword or short phrase. Add more bluesky sources
    # for other angles (e.g. "AI research", "AI safety") rather than trying
    # to OR them in one query.
    name: Bluesky · language models
    query: language model
    weight: 0.55
    tags: [social, ai]

  - id: deepmind-blog
    type: rss
    name: Google DeepMind
    url: https://deepmind.google/blog/rss.xml
    weight: 0.85
    tags: [ai, primary-source]

  - id: digiday
    type: rss
    name: Digiday
    url: https://digiday.com/feed/
    weight: 0.6
    tags: [platforms, media, monetization, advertising]

  - id: github-ai-releases
    type: github
    # New releases from tracked AI libraries → curate/dispatch fodder. Works
    # unauthenticated (60 req/hr); set GITHUB_TOKEN for 5000 req/hr.
    name: GitHub · AI releases
    repos:
      - openai/openai-python
      - anthropics/anthropic-sdk-python
      - huggingface/transformers
      - vllm-project/vllm
      - ollama/ollama
      - ggml-org/llama.cpp
      - langchain-ai/langchain
    weight: 0.7
    tags: [ai, oss, releases]

  - id: gnews-ai
    type: gnews
    # Requires GNEWS_API_KEY (free tier: 100 req/day, 10 results/search).
    # Skipped automatically when the key is unset.
    name: GNews · AI
    query: artificial intelligence
    weight: 0.6
    tags: [ai, news]

  - id: google-research
    type: rss
    name: Google Research
    url: https://research.google/blog/rss/
    weight: 0.85
    tags: [ai, primary-source]

  - id: guardian-tech
    type: guardian
    # Requires GUARDIAN_API_KEY (free Open Platform key, generous limit).
    # Skipped automatically when the key is unset.
    name: The Guardian · Technology
    query: artificial intelligence
    section: technology
    weight: 0.6
    tags: [tech, news]

  - id: hf-blog
    type: rss
    name: Hugging Face
    url: https://huggingface.co/blog/feed.xml
    weight: 0.7
    tags: [ai, oss]

  - id: hn-frontpage
    type: hn
    name: Hacker News (front page)
    weight: 0.5
    tags: [general, tech]

  - id: import-ai
    type: rss
    name: Import AI (Jack Clark)
    url: https://jack-clark.net/feed/
